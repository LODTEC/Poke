name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -o projeto.zip -d src_proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        working-directory: src_proj/ShinyBot
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shiny Bot build ${{ github.run_number }}
          files: src_proj/ShinyBot/app/build/outputs/apk/debug/app-debug.apk
